name: Publish Docker image

# Builds the production image (linux/arm64 only) and pushes it to GHCR tagged
# with the short commit SHA, e.g. ghcr.io/maziggy/bambuddy:cf2f95f. Builds from
# main are additionally tagged `latest`.
#
# Runs automatically after the CI workflow succeeded on a push to main, so a
# red build is never published. It can also be started manually from the
# Actions tab on any branch, which builds that branch's latest commit without
# waiting for CI. Old SHA tags are pruned by docker-retention.yml.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One group per branch. GitHub keeps only one pending run per group, so a
# shared group would let a manual branch run cancel a queued main publish.
# Within a branch, runs queue in order so `latest` ends on the newest commit.
concurrency:
  group: docker-publish-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push (arm64)
    # Native arm64 runner: no QEMU emulation, much faster than cross-building.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # Manual runs publish whichever branch they were started on (for testing a
    # branch build); starting one from a tag is skipped. Automatic runs publish
    # only commits pushed to main of this repository: workflow_run has access
    # to secrets, so never act on a run that came from a PR or a fork.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    env:
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      # workflow_run executes against the default branch's context, so check
      # out the exact commit CI validated rather than whatever main is now.
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT_SHA }}

      # Checking out a SHA leaves HEAD detached, but the Dockerfile copies
      # .git/HEAD into the image so detect_current_branch() can read
      # `ref: refs/heads/<branch>`. Re-attach HEAD to the branch at this commit.
      - name: Attach HEAD to branch
        run: git checkout -B "$BRANCH" "$COMMIT_SHA"

      # Every build gets the short SHA tag; builds from main also move `latest`.
      # Cut the SHA string rather than `git rev-parse --short`, which may emit
      # more than 7 chars to stay unambiguous; docker-retention.yml matches
      # exactly 7 hex chars.
      - name: Compute image tags
        id: vars
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<EOF"
            echo "${image}:${COMMIT_SHA::7}"
            if [ "$BRANCH" = "main" ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
